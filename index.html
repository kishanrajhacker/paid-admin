<!DOCTYPE html>
<html lang="hi" data-theme="matrix">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#020a04">
<title>Premium APK Store — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= BASE / RESET ================= */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; padding: 0;
  min-height: 100vh;
  font-family: var(--font-body, system-ui, -apple-system, sans-serif);
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  transition: background-color 1.2s ease, color 1.2s ease;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; height: auto; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--on-accent); }

/* ================= THEME VARIABLES (defaults = matrix) ================= */
:root {
  --bg: #020a04;
  --bg2: #041207;
  --surface: rgba(4, 20, 10, 0.88);
  --surface2: rgba(6, 30, 14, 0.92);
  --surface-solid: #04140a;
  --border: #0b3d1c;
  --border-strong: #00ff66;
  --text: #c8ffe0;
  --text-dim: #6fa882;
  --text-strong: #eafff2;
  --accent: #00ff66;
  --accent2: #0b3d1c;
  --accent-soft: rgba(0, 255, 102, 0.12);
  --on-accent: #021004;
  --success: #00ff66;
  --success-bg: rgba(0,255,102,0.12);
  --danger: #ff4d5e;
  --danger-bg: rgba(255,77,94,0.12);
  --warning: #ffcc00;
  --warning-bg: rgba(255,204,0,0.12);
  --info: #38bdf8;
  --info-bg: rgba(56,189,248,0.12);
  --price: #ffd166;
  --radius: 2px;
  --radius-lg: 4px;
  --shadow: 0 0 0 1px var(--border), 0 0 24px rgba(0,255,102,0.08);
  --shadow-lg: 0 0 0 1px var(--border-strong), 0 0 40px rgba(0,255,102,0.18);
  --font-body: "Share Tech Mono", "JetBrains Mono", ui-monospace, monospace;
  --font-head: "Share Tech Mono", "JetBrains Mono", ui-monospace, monospace;
  --font-mono: "JetBrains Mono", "Share Tech Mono", ui-monospace, monospace;
  --fx-opacity: 0.35;
  --card-blur: none;
  --transition: background-color 1.2s ease, color 1.2s ease, border-color 1.2s ease, box-shadow 1.2s ease;
}

/* THEME 2: GALAXY */
[data-theme="galaxy"] {
  --bg: #05030f; --bg2: #120a2e;
  --surface: rgba(20, 16, 44, 0.72); --surface2: rgba(30, 24, 60, 0.8);
  --surface-solid: #140f2c;
  --border: rgba(255,255,255,0.12); --border-strong: #8b5cf6;
  --text: #e6e1ff; --text-dim: #a49cd6; --text-strong: #ffffff;
  --accent: #8b5cf6; --accent2: #38bdf8; --accent-soft: rgba(139,92,246,0.16);
  --on-accent: #0a0618;
  --success: #34d399; --success-bg: rgba(52,211,153,0.14);
  --danger: #f472b6; --danger-bg: rgba(244,114,182,0.14);
  --warning: #fbbf24; --warning-bg: rgba(251,191,36,0.14);
  --info: #38bdf8; --info-bg: rgba(56,189,248,0.14);
  --price: #f472b6;
  --radius: 12px; --radius-lg: 20px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--border);
  --shadow-lg: 0 16px 56px rgba(139,92,246,0.3), 0 0 0 1px var(--border-strong);
  --font-body: "Space Grotesk", system-ui, sans-serif;
  --font-head: "Orbitron", "Space Grotesk", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --fx-opacity: 0.5; --card-blur: blur(14px);
}
/* THEME 3: 3D DEPTH */
[data-theme="depth"] {
  --bg: #0d1117; --bg2: #161b22;
  --surface: rgba(22, 27, 34, 0.9); --surface2: rgba(30, 36, 46, 0.95);
  --surface-solid: #161b22;
  --border: rgba(88,166,255,0.2); --border-strong: #58a6ff;
  --text: #e6edf3; --text-dim: #8b949e; --text-strong: #ffffff;
  --accent: #58a6ff; --accent2: #a371f7; --accent-soft: rgba(88,166,255,0.14);
  --on-accent: #0d1117;
  --success: #3fb950; --success-bg: rgba(63,185,80,0.14);
  --danger: #f85149; --danger-bg: rgba(248,81,73,0.14);
  --warning: #d29922; --warning-bg: rgba(210,153,34,0.14);
  --info: #58a6ff; --info-bg: rgba(88,166,255,0.14);
  --price: #f0883e;
  --radius: 10px; --radius-lg: 16px;
  --shadow: 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
  --shadow-lg: 0 2px 0 rgba(255,255,255,0.08), 0 20px 48px rgba(0,0,0,0.7), 0 0 0 1px var(--border-strong);
  --font-body: "Inter", system-ui, sans-serif;
  --font-head: "Rajdhani", "Inter", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --fx-opacity: 0.2;
}
/* THEME 4: INTERNATIONAL (light) */
[data-theme="intl"] {
  --bg: #f5f8ff; --bg2: #eaf1ff;
  --surface: rgba(255,255,255,0.94); --surface2: rgba(248,251,255,0.98);

  --on-accent: #ffffff;
  --success: #0a8f5b; --success-bg: rgba(10,143,91,0.1);
  --danger: #c0392b; --danger-bg: rgba(192,57,43,0.1);
  --warning: #b45309; --warning-bg: rgba(180,83,9,0.1);
  --info: #0a3d91; --info-bg: rgba(10,61,145,0.08);

  --radius: 8px; --radius-lg: 14px;
  --shadow: 0 4px 16px rgba(10,61,145,0.1), 0 0 0 1px var(--border);
  --shadow-lg: 0 12px 40px rgba(10,61,145,0.18), 0 0 0 1px var(--border-strong);
  --font-body: "Inter", system-ui, sans-serif;
  --font-head: "Cinzel", "Inter", serif;
  --font-mono: "JetBrains Mono", monospace;
  --fx-opacity: 0.15;
}
/* THEME 5: CYBERPUNK */
[data-theme="cyberpunk"] {

  --danger: #ff2bd6; --danger-bg: rgba(255,43,214,0.16);
  --warning: #fcee0a; --warning-bg: rgba(252,238,10,0.14);
  --info: #00e5ff; --info-bg: rgba(0,229,255,0.14);
  --price: #fcee0a;
  --radius: 0px; --radius-lg: 0px;
  --shadow: 0 0 0 1px var(--border), 0 0 20px rgba(255,43,214,0.15);
  --shadow-lg: 0 0 0 2px var(--border-strong), 0 0 40px rgba(255,43,214,0.3);
  --font-body: "Rajdhani", system-ui, sans-serif;
  --font-head: "Orbitron", "Rajdhani", sans-serif;
  --font-mono: "JetBrains Mono", monospace;
  --fx-opacity: 0.35;
}
/* THEME 6: AURORA */
[data-theme="aurora"] {
  --bg: #04121a; --bg2: #0a2a2a;
  --surface: rgba(10, 42, 42, 0.72); --surface2: rgba(14, 52, 52, 0.82);

}

  --bg: #1a0b2e; --bg2: #2a1150;

  --border: rgba(0,194,255,0.25); --border-strong: #00c2ff;
  --text: #e0f7ff; --text-dim: #8fc9dd; --text-strong: #ffffff;

[data-theme="gold"] {

  --border: rgba(212,175,55,0.3); --border-strong: #d4af37;
  --text: #f5e9d0; --text-dim: #b8a77e; --text-strong: #fff8e6;
  --accent: #d4af37; --accent2: #f5d98b; --accent-soft: rgba(212,175,55,0.14);

  --info: #d4af37; --info-bg: rgba(212,175,55,0.14);

  --radius: 6px; --radius-lg: 10px;
  --shadow: 0 0 0 1px var(--border), 0 8px 28px rgba(212,175,55,0.1);

[data-theme="blueprint"] {
  --bg: #06223f; --bg2: #0a2d52;
  --surface: rgba(6, 34, 63, 0.86); --surface2: rgba(10, 45, 82, 0.92);
  --surface-solid: #06223f;
  --border: rgba(125,211,252,0.3); --border-strong: #7dd3fc;
  --text: #d6ecff; --text-dim: #7fa8c9; --text-strong: #ffffff;
  --accent: #7dd3fc; --accent2: #38bdf8; --accent-soft: rgba(125,211,252,0.14);
  --on-accent: #06223f;
  --success: #7dd3fc; --success-bg: rgba(125,211,252,0.14);
  --danger: #fca5a5; --danger-bg: rgba(252,165,165,0.14);
  --warning: #fde68a; --warning-bg: rgba(253,230,138,0.14);
  --info: #7dd3fc; --info-bg: rgba(125,211,252,0.14);
  --price: #fde68a;
  --radius: 2px; --radius-lg: 4px;
  --shadow: 0 0 0 1px var(--border), 0 4px 16px rgba(0,0,0,0.3);
  --shadow-lg: 0 0 0 1px var(--border-strong), 0 8px 32px rgba(125,211,252,0.15);
  --font-body: "JetBrains Mono", ui-monospace, monospace;
  --font-head: "JetBrains Mono", monospace;
  --font-mono: "JetBrains Mono", monospace;

}

/* ================= BACKGROUND FX ================= */
#fx-canvas {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1; pointer-events: none; opacity: var(--fx-opacity);
  transition: opacity 1.2s ease;
}
#fx-css {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  opacity: 0; transition: opacity 1.2s ease;
}
[data-theme="aurora"] #fx-css { opacity: 1; }
[data-theme="intl"] #fx-css { opacity: 1; }
[data-theme="cyberpunk"] #fx-css { opacity: 1; }
[data-theme="synthwave"] #fx-css { opacity: 1; }
[data-theme="ocean"] #fx-css { opacity: 1; }
[data-theme="blueprint"] #fx-css { opacity: 1; }
[data-theme="depth"] #fx-css { opacity: 1; }

/* ================= LAYOUT ================= */
.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: var(--surface);
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border-bottom: 1px solid var(--border);
  transition: var(--transition);
}
.topbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.topbar .logo {
  width: 36px; height: 36px; border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: grid; place-items: center; font-weight: 700; color: var(--on-accent);
  font-family: var(--font-head); flex-shrink: 0;
}
.topbar h1 {
  font-family: var(--font-head); font-size: 16px; margin: 0;
  color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  letter-spacing: 0.5px;
}
.topbar .subtitle { font-size: 11px; color: var(--text-dim); }
.topbar .user {
  display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim);
}
.topbar .user img { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); }
.topbar .user .uname { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs {
  display: flex; gap: 4px; padding: 8px 16px; overflow-x: auto;
  background: var(--surface); border-bottom: 1px solid var(--border);
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
  backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  position: sticky; top: 57px; z-index: 49;
  transition: var(--transition);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; padding: 8px 14px; border-radius: var(--radius);
  color: var(--text-dim); font-size: 13px; white-space: nowrap;
  border: 1px solid transparent; min-height: 40px; display: inline-flex; align-items: center;
  transition: all 0.2s ease; font-family: var(--font-body);
}
.tab:hover { color: var(--text); background: var(--accent-soft); }
.tab.active { color: var(--accent); border-color: var(--border-strong); background: var(--accent-soft); }
.tab .badge {
  position: absolute; top: -4px; right: -6px;
  background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center;
  padding: 0 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

main { flex: 1; padding: 16px; max-width: 1100px; width: 100%; margin: 0 auto; }
.panel {
  background: var(--surface); backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px;
  transition: var(--transition);
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.panel-title { font-family: var(--font-head); font-size: 18px; color: var(--text-strong); margin: 0; }
.panel-sub { font-size: 12px; color: var(--text-dim); margin: 4px 0 0; }

/* ================= BUTTONS ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: var(--radius);
  background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); font-size: 14px;
  transition: all 0.15s ease; font-family: var(--font-body);
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled) { border-color: var(--border-strong); background: var(--accent-soft); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.1); background: var(--accent); }
.btn-success { background: var(--success); color: var(--on-accent); border-color: var(--success); font-weight: 600; }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 600; }
.btn-danger:hover:not(:disabled) { filter: brightness(1.1); }
.btn-ghost { background: transparent; }
.btn-sm { min-height: 36px; padding: 0 10px; font-size: 12px; border-radius: var(--radius); }
.btn-icon { min-width: 44px; padding: 0; }
.btn-block { width: 100%; }

/* ================= FORMS ================= */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
.field label .req { color: var(--danger); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  background: var(--surface-solid); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 14px; transition: border-color 0.2s ease;
  font-family: var(--font-body);
}
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input::placeholder, .textarea::placeholder { color: var(--text-dim); opacity: 0.7; }
.textarea { min-height: 90px; resize: vertical; }
.input.mono { font-family: var(--font-mono); font-size: 13px; }
.input.error, .textarea.error, .select.error { border-color: var(--danger); }
.field-error { color: var(--danger); font-size: 12px; margin-top: 4px; display: none; }
.field-error.show { display: block; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 0 16px; }
@media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.price-input { font-size: 22px !important; font-weight: 700; color: var(--price) !important; min-height: 56px !important; }
.quick-prices { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.quick-prices .btn { min-height: 34px; padding: 0 12px; font-size: 13px; }

/* ================= SWITCH ================= */
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 44px; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  width: 42px; height: 24px; border-radius: 12px; background: var(--border);
  position: relative; transition: background 0.2s ease; flex-shrink: 0;
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
  border-radius: 50%; background: var(--text); transition: transform 0.2s ease;
}
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(18px); background: var(--on-accent); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ================= CARDS / LISTS ================= */
.card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px; margin-bottom: 12px;
  transition: var(--transition); box-shadow: var(--shadow);
}
.card:hover { border-color: var(--border-strong); }
.card-head { display: flex; align-items: flex-start; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.card-title { font-weight: 600; color: var(--text-strong); font-size: 15px; margin: 0; }
.card-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.price-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px;
  border-radius: var(--radius); font-weight: 700; font-size: 14px;
  background: var(--accent-soft); color: var(--price); border: 1px solid var(--border);
}
.price-badge.free { color: var(--success); background: var(--success-bg); }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px;
  border-radius: 999px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim);
}
.chip.pending { color: var(--warning); background: var(--warning-bg); border-color: var(--warning); }
.chip.approved { color: var(--success); background: var(--success-bg); border-color: var(--success); }
.chip.rejected, .chip.revoked { color: var(--danger); background: var(--danger-bg); border-color: var(--danger); }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: var(--radius); }
.flag.danger { color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger); }
.flag.success { color: var(--success); background: var(--success-bg); border: 1px solid var(--success); }
.flag.warning { color: var(--warning); background: var(--warning-bg); border: 1px solid var(--warning); }

/* ================= FILTERS ================= */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filter-btn {
  min-height: 38px; padding: 0 14px; border-radius: var(--radius);
  background: var(--surface2); color: var(--text-dim);
  border: 1px solid var(--border); font-size: 13px; transition: all 0.2s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.filter-btn:hover { color: var(--text); border-color: var(--border-strong); }
.filter-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.filter-btn .count {
  background: var(--surface-solid); border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700;
}
.search-wrap { flex: 1; min-width: 180px; }
.search-wrap .input { min-height: 40px; }

/* ================= APP ROW ================= */
.app-row { display: flex; gap: 12px; align-items: center; }
.app-icon {
  width: 48px; height: 48px; border-radius: var(--radius); flex-shrink: 0;
  object-fit: cover; border: 1px solid var(--border); background: var(--surface-solid);
  display: grid; place-items: center; font-weight: 700; color: var(--accent); font-family: var(--font-head);
}
.app-info { flex: 1; min-width: 0; }
.app-info .name { font-weight: 600; color: var(--text-strong); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-info .pkg { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.star-btn { font-size: 20px; color: var(--text-dim); min-width: 44px; min-height: 44px; display: grid; place-items: center; transition: transform 0.15s ease; }
.star-btn.on { color: var(--warning); }
.star-btn:hover { transform: scale(1.15); }

/* ================= EMPTY / ERROR ================= */
.empty { text-align: center; padding: 40px 16px; color: var(--text-dim); font-size: 14px; }
.empty .big { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }
.error-card {
  background: var(--danger-bg); border: 1px solid var(--danger);
  border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; color: var(--text);
}
.error-card .code { font-family: var(--font-mono); font-size: 11px; color: var(--danger); margin-top: 6px; word-break: break-all; }

/* ================= LOGIN GATE ================= */
#gate {
  position: fixed; inset: 0; z-index: 200;
  display: grid; place-items: center; padding: 20px;
  background: var(--bg);
}
#gate .gate-box {
  background: var(--surface); backdrop-filter: var(--card-blur);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); padding: 32px 24px; max-width: 420px; width: 100%;
  text-align: center;
}
#gate .gate-logo {
  width: 64px; height: 64px; margin: 0 auto 16px; border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: grid; place-items: center; font-size: 28px; font-weight: 700; color: var(--on-accent);
  font-family: var(--font-head);
}
#gate h2 { font-family: var(--font-head); margin: 0 0 6px; color: var(--text-strong); font-size: 22px; }
#gate p { color: var(--text-dim); font-size: 13px; margin: 0 0 20px; line-height: 1.5; }
#gate .login-error {
  background: var(--danger-bg); border: 1px solid var(--danger); color: var(--text);
  padding: 12px; border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; text-align: left;
}
#gate .login-error .code { font-family: var(--font-mono); font-size: 11px; color: var(--danger); display: block; margin-top: 4px; word-break: break-all; }
#gate .not-admin { background: var(--warning-bg); border: 1px solid var(--warning); padding: 16px; border-radius: var(--radius); color: var(--text); }

/* ================= DIALOG ================= */
.dialog-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  display: none; place-items: center; padding: 20px;
}
.dialog-overlay.open { display: grid; }
.dialog {
  background: var(--surface-solid); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  max-width: 440px; width: 100%; padding: 20px;
  animation: dialogIn 0.2s ease;
}
@keyframes dialogIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
.dialog h3 { margin: 0 0 8px; font-family: var(--font-head); color: var(--text-strong); font-size: 18px; }
.dialog .dialog-body { font-size: 14px; color: var(--text); margin-bottom: 16px; line-height: 1.5; }
.dialog .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* ================= THEME PILL ================= */
#theme-pill {
  position: fixed; bottom: 16px; right: 16px; z-index: 100;
  background: var(--surface); backdrop-filter: var(--card-blur);
  -webkit-backdrop-filter: var(--card-blur);
  border: 1px solid var(--border-strong); border-radius: 999px;
  box-shadow: var(--shadow-lg); padding: 6px 10px;
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text); max-width: calc(100vw - 32px);
  transition: var(--transition);
}
#theme-pill .tname { font-weight: 600; min-width: 60px; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-head); font-size: 11px; }
#theme-pill .progress-ring { width: 24px; height: 24px; flex-shrink: 0; }
#theme-pill button { min-width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--text); background: var(--surface2); border: 1px solid var(--border); font-size: 14px; transition: all 0.15s ease; }
#theme-pill button:hover { border-color: var(--accent); color: var(--accent); }
#theme-pill .dots { display: flex; gap: 3px; flex-wrap: wrap; max-width: 100px; }
#theme-pill .dot { width: 12px; height: 12px; min-width: 12px; border-radius: 50%; border: 1px solid var(--border); padding: 0; cursor: pointer; }
#theme-pill .dot.active { border: 2px solid var(--text-strong); transform: scale(1.15); }

/* ================= TOAST ================= */
#toast-container {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 300; display: flex; flex-direction: column; gap: 8px;
  align-items: center; width: calc(100% - 32px); max-width: 400px; pointer-events: none;
}
.toast {
  background: var(--surface-solid); border: 1px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 10px 16px; font-size: 13px; color: var(--text);
  animation: toastIn 0.25s ease; pointer-events: auto; max-width: 100%;
  word-break: break-word;
}
.toast.success { border-color: var(--success); }
.toast.error { border-color: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ================= LOADER ================= */
.loader-svg { display: inline-block; vertical-align: middle; }
.loader-wrap { display: grid; place-items: center; padding: 40px 16px; gap: 12px; color: var(--text-dim); font-size: 13px; }
@keyframes loaderOuter { to { transform: rotate(360deg); } }
@keyframes loaderInner { to { transform: rotate(-360deg); } }
@keyframes loaderDot { 0%,100% { transform: scale(0.6); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes loaderArrow { 0%,100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }
.loader-outer { transform-origin: center; animation: loaderOuter 1.1s linear infinite; }
.loader-inner { transform-origin: center; animation: loaderInner 1.8s linear infinite; }
.loader-dot { transform-origin: center; animation: loaderDot 1.4s ease-in-out infinite; }
.loader-arrow { transform-origin: center; animation: loaderArrow 0.9s ease-in-out infinite alternate; }
@media (prefers-reduced-motion: reduce) {
  .loader-outer { animation-duration: 3s; }
  .loader-inner { animation-duration: 4s; }
  .loader-dot { animation-duration: 3s; }
  .loader-arrow { animation-duration: 2.5s; }
}

/* ================= OFFLINE BANNER ================= */
#offline-banner {
  display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 500;
  background: var(--warning); color: #000; text-align: center;
  padding: 8px 16px; font-size: 13px; font-weight: 600;
  animation: offlinePulse 2s ease-in-out infinite;
}
#offline-banner.show { display: block; }
@keyframes offlinePulse { 0%,100% { opacity: 1; } 50% { opacity: 0.75; } }

/* ================= MISC ================= */
.mono { font-family: var(--font-mono); }
.text-dim { color: var(--text-dim); }
.text-danger { color: var(--danger); }
.text-success { color: var(--success); }
.mt-2 { margin-top: 8px; } .mt-4 { margin-top: 16px; } .mb-2 { margin-bottom: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.stat-card .label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .value { font-size: 22px; font-weight: 700; color: var(--text-strong); margin-top: 4px; font-family: var(--font-head); }
.stat-card .value.price { color: var(--price); }
.hidden { display: none !important; }
.utr-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.utr { font-family: var(--font-mono); font-size: 15px; font-weight: 700; letter-spacing: 1px; color: var(--text-strong); background: var(--surface-solid); padding: 3px 8px; border-radius: var(--radius); border: 1px solid var(--border); }

/* ================= 3D TILT (theme depth) ================= */
[data-theme="depth"] .card:hover { transform: translateZ(6px); }
[data-theme="depth"] .btn-primary:active { transform: translateY(2px); box-shadow: none; }

/* ================= SCANLINE (matrix) ================= */
[data-theme="matrix"] .app-shell::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,255,102,0.04) 0px, rgba(0,255,102,0.04) 1px, transparent 1px, transparent 3px);
  opacity: 0.5;
}

/* ================= CYBERPUNK GLITCH ================= */
[data-theme="cyberpunk"] .topbar h1 { animation: glitch 5s infinite; }
@keyframes glitch {
  0%, 92%, 100% { clip-path: none; transform: none; }
  93% { clip-path: inset(20% 0 40% 0); transform: translate(-2px, 0); }
  94% { clip-path: inset(60% 0 10% 0); transform: translate(2px, 0); }
  95% { clip-path: none; transform: none; }
}

/* ================= SYNTHWAVE GRID ================= */
[data-theme="synthwave"] #fx-css {
  background:
    radial-gradient(ellipse at 50% 100%, rgba(255,110,199,0.25) 0%, transparent 60%),
    linear-gradient(transparent 60%, rgba(123,47,247,0.15) 100%);
}

/* ================= AURORA BLOBS ================= */
[data-theme="aurora"] #fx-css {
  background:
    radial-gradient(circle at 20% 30%, rgba(61,255,181,0.18) 0%, transparent 40%),
    radial-gradient(circle at 80% 60%, rgba(167,139,250,0.16) 0%, transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(34,211,238,0.14) 0%, transparent 40%);
  animation: auroraMove 12s ease-in-out infinite alternate;
}
@keyframes auroraMove { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.15) rotate(3deg); } }

/* ================= INTL MAP DOTS ================= */
[data-theme="intl"] #fx-css {
  background-image: radial-gradient(rgba(10,61,145,0.15) 1px, transparent 1px);
  background-size: 20px 20px;
}

/* ================= CYBERPUNK GRID ================= */
[data-theme="cyberpunk"] #fx-css {
  background:
    linear-gradient(rgba(255,43,214,0.1) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, rgba(0,229,255,0.08) 1px, transparent 1px) 0 0 / 40px 40px;
  perspective: 400px;
}

/* ================= OCEAN CAUSTICS ================= */
[data-theme="ocean"] #fx-css {
  background:
    radial-gradient(ellipse at 30% 0%, rgba(0,194,255,0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 20%, rgba(94,234,212,0.15) 0%, transparent 50%);
}

/* ================= BLUEPRINT GRID ================= */
[data-theme="blueprint"] #fx-css {
  background:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 24px 24px;
  animation: gridPan 20s linear infinite;
}
@keyframes gridPan { from { background-position: 0 0, 0 0; } to { background-position: 24px 24px, 24px 24px; } }

/* ================= LOW-END / REDUCED MOTION ================= */
body.no-fx #fx-canvas { display: none; }
body.no-fx #fx-css { opacity: 0 !important; animation: none !important; }
body.reduced-motion * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }

/* ================= CURSOR COORD (blueprint) ================= */
#cursor-coord {
  position: fixed; pointer-events: none; z-index: 999; display: none;
  font-family: var(--font-mono); font-size: 10px; color: var(--accent);
  background: var(--surface-solid); padding: 2px 6px; border-radius: var(--radius);
  border: 1px solid var(--border);
}
[data-theme="blueprint"] #cursor-coord { display: block; }
@media (pointer: coarse) { #cursor-coord { display: none !important; } }

/* ================= SCROLL ================= */
@media (max-width: 600px) {
  .topbar { padding: 8px 12px; }
  .topbar h1 { font-size: 14px; }
  main { padding: 12px; }
  .panel { padding: 12px; }
  #theme-pill { bottom: 10px; right: 10px; padding: 5px 8px; gap: 5px; }
  #theme-pill .dots { display: none; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
}
</style>

const normalize = (val) => {
  if (val == null) return null;
  if (Array.isArray(val)) return val.map(normalize);
  if (typeof val === "object") {
    const isArr = Object.keys(val).every(k => /^\d+$/.test(k));
    if (isArr && Object.keys(val).length > 0) return Object.values(val).map(normalize);
    const out = {};
    for (const [k, v] of Object.entries(val)) { const nv = normalize(v); if (nv !== null && nv !== undefined) out[k] = nv; }
    return out;
  }

};
const normalizeArray = (v) => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);
const cleanUndefined = (obj) => {
  if (Array.isArray(obj)) return obj.map(cleanUndefined).filter(x => x !== undefined);

    const out = {};
    for (const [k, v] of Object.entries(obj)) { const c = cleanUndefined(v); if (c !== undefined) out[k] = c; }

// ================= Theme engine =================
const THEMES = [
  { id: "matrix", name: "Matrix", fx: "matrix" },
  { id: "galaxy", name: "Galaxy", fx: "galaxy" },
  { id: "depth", name: "3D Depth", fx: "depth" },
  { id: "intl", name: "International", fx: "intl" },
  { id: "cyberpunk", name: "Cyberpunk", fx: "cyberpunk" },
  { id: "aurora", name: "Aurora", fx: "aurora" },
  { id: "synthwave", name: "Synthwave", fx: "synthwave" },
  { id: "ocean", name: "Ocean", fx: "ocean" },
  { id: "gold", name: "Gold", fx: "gold" },
  { id: "blueprint", name: "Blueprint", fx: "blueprint" }
];
const THEME_MS = 10000;
let themeIndex = 0;
let themeMode = "auto"; // auto | locked
let themePaused = false;
let themePausedReasons = new Set();
let themeTimer = null;
let themeTickStart = 0;
let autoPauseTimeout = null;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function loadThemePrefs() {
  try {
    const saved = localStorage.getItem("apkstore_theme");
    if (saved) {
      const o = JSON.parse(saved);
      if (o.mode === "locked" && Number.isInteger(o.index)) { themeMode = "locked"; themeIndex = o.index; }
      else if (o.mode === "auto") themeMode = "auto";
    }
  } catch (e) {}
}
function saveThemePrefs() {
  try { localStorage.setItem("apkstore_theme", JSON.stringify({ mode: themeMode, index: themeIndex })); } catch (e) {}
}
function applyTheme(idx, animate = true) {
  themeIndex = ((idx % THEMES.length) + THEMES.length) % THEMES.length;
  const t = THEMES[themeIndex];
  if (animate) {
    document.documentElement.style.transition = "background-color 1.2s ease";
  }
  document.documentElement.setAttribute("data-theme", t.id);
  updatePill();
  startFx(t.fx);
  themeTickStart = Date.now();
  saveThemePrefs();
}
function startThemeCycle() {
  if (themeTimer) clearInterval(themeTimer);
  themeTickStart = Date.now();
  themeTimer = setInterval(() => {
    if (themePausedReasons.size > 0 || themeMode !== "auto") { themeTickStart = Date.now(); return; }
    if (document.hidden) { themeTickStart = Date.now(); return; }
    if (Date.now() - themeTickStart >= THEME_MS) {
      applyTheme(themeIndex + 1);
      themeTickStart = Date.now();
    }
    updatePillProgress();
  }, 250);
  // Also update progress more smoothly
  if (themeTimer) { clearInterval(themeTimer); }
  themeTimer = setInterval(tickTheme, 200);
}
function tickTheme() {
  if (themeMode !== "auto") { updatePillProgress(); return; }
  if (themePausedReasons.size > 0 || document.hidden) { themeTickStart = Date.now(); updatePillProgress(); return; }
  if (Date.now() - themeTickStart >= THEME_MS) {
    applyTheme(themeIndex + 1);
    themeTickStart = Date.now();
  }
  updatePillProgress();
}
function updatePill() {
  const t = THEMES[themeIndex];
  const nameEl = $("#pill-name");
  if (nameEl) nameEl.textContent = t.name;
  const dots = $("#pill-dots");
  if (dots) {
    if (dots.children.length !== THEMES.length) {
      dots.innerHTML = "";
      THEMES.forEach((th, i) => {
        const d = el("button", { class: "dot", title: th.name, "aria-label": th.name });
        d.style.background = `linear-gradient(135deg, var(--accent), var(--accent2))`;
        d.addEventListener("click", () => { themeMode = "locked"; themeIndex = i; applyTheme(i); themeTickStart = Date.now(); saveThemePrefs(); });
        dots.append(d);
      });
    }
    Array.from(dots.children).forEach((d, i) => d.classList.toggle("active", i === themeIndex));
  }
  const playBtn = $("#pill-play");
  if (playBtn) playBtn.textContent = themeMode === "locked" ? "▶" : (themePausedReasons.size > 0 ? "⏸" : "⏸");
}
function updatePillProgress() {
  const ring = $("#pill-ring");
  if (!ring) return;
  const circ = 94.2;
  let pct = 0;
  if (themeMode === "auto" && themePausedReasons.size === 0) {
    pct = Math.min(1, (Date.now() - themeTickStart) / THEME_MS);
  }
  ring.setAttribute("stroke-dashoffset", String(circ * (1 - pct)));
}
function pauseTheme(reason) {
  themePausedReasons.add(reason);
  updatePill();
}
function resumeTheme(reason) {
  themePausedReasons.delete(reason);
  themeTickStart = Date.now();
  if (autoPauseTimeout) clearTimeout(autoPauseTimeout);
  autoPauseTimeout = setTimeout(() => { updatePill(); }, 10000);
  updatePill();
}
function nextTheme() { themeMode = "locked"; applyTheme(themeIndex + 1); themeTickStart = Date.now(); saveThemePrefs(); }
function prevTheme() { themeMode = "locked"; applyTheme(themeIndex - 1); themeTickStart = Date.now(); saveThemePrefs(); }
function togglePlay() {
  if (themeMode === "auto") { themeMode = "locked"; }
  else { themeMode = "auto"; themeTickStart = Date.now(); }
  saveThemePrefs(); updatePill();
}

// ================= Background FX =================
let fx = {
  canvas: null, ctx: null, rafId: null, mode: null, particles: [], lastFrame: 0, dpr: 1,
  w: 0, h: 0, running: false, lowEnd: false, frameTimes: [], stars: [], bubbles: [], gold: []
};
function fxCanvasInit() {
  fx.canvas = $("#fx-canvas");
  if (!fx.canvas) return;
  fx.ctx = fx.canvas.getContext("2d");
  fx.dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  resizeFx();
  window.addEventListener("resize", resizeFx);
}
function resizeFx() {
  if (!fx.canvas) return;
  fx.w = window.innerWidth; fx.h = window.innerHeight;
  fx.canvas.width = Math.floor(fx.w * fx.dpr);
  fx.canvas.height = Math.floor(fx.h * fx.dpr);
  fx.canvas.style.width = fx.w + "px";
  fx.canvas.style.height = fx.h + "px";
  if (fx.ctx) fx.ctx.setTransform(fx.dpr, 0, 0, fx.dpr, 0, 0);
  if (fx.mode) startFx(fx.mode); // re-seed particles
}
function stopFx() {
  if (fx.rafId) cancelAnimationFrame(fx.rafId);
  fx.rafId = null; fx.mode = null; fx.running = false;
  if (fx.ctx) fx.ctx.clearRect(0, 0, fx.w, fx.h);
}
function startFx(mode) {
  stopFx();
  if (reducedMotion || fx.lowEnd || !fx.canvas) {
    fx.mode = mode;
    if (fx.ctx) fx.ctx.clearRect(0, 0, fx.w, fx.h);
    return;
  }
  fx.mode = mode;
  fx.running = true;
  fx.lastFrame = performance.now();
  fx.frameTimes = [];
  const isMobile = fx.w < 600;
  const count = isMobile ? 0.5 : 1;

  if (mode === "matrix") {
    const cols = Math.floor(fx.w / 16);
    fx.particles = Array.from({ length: cols }, (_, i) => ({ x: i * 16, y: Math.random() * fx.h, speed: 30 + Math.random() * 60, chars: Array.from({length: 20}, () => String.fromCharCode(0x30A0 + Math.floor(Math.random()*96))) }));
  } else if (mode === "galaxy") {
    fx.stars = Array.from({ length: Math.floor(140 * count) }, () => ({ x: Math.random()*fx.w, y: Math.random()*fx.h, r: Math.random()*1.6+0.3, layer: Math.floor(Math.random()*3), tw: Math.random()*Math.PI*2 }));
    fx.particles = [];
  } else if (mode === "ocean") {
    fx.bubbles = Array.from({ length: Math.floor(40 * count) }, () => ({ x: Math.random()*fx.w, y: Math.random()*fx.h, r: 2 + Math.random()*8, sp: 15 + Math.random()*40 }));
  } else if (mode === "gold") {
    fx.gold = Array.from({ length: Math.floor(30 * count) }, () => ({ x: Math.random()*fx.w, y: Math.random()*fx.h, r: 0.6 + Math.random()*1.8, sp: 8 + Math.random()*20, drift: (Math.random()-0.5)*10 }));
  } else {
    // no canvas effect
    return;
  }
  const loop = (ts) => {
    if (!fx.running) return;
    const dt = Math.min(60, ts - fx.lastFrame) / 1000;
    fx.lastFrame = ts;
    // frame time check for low-end
    fx.frameTimes.push(dt);
    if (fx.frameTimes.length > 60) fx.frameTimes.shift();
    if (fx.frameTimes.length === 60) {
      const avg = fx.frameTimes.reduce((a,b)=>a+b,0)/60;
      if (avg > 0.045) { fx.lowEnd = true; stopFx(); document.body.classList.add("no-fx"); return; }
    }
    drawFx(mode, dt);
    fx.rafId = requestAnimationFrame(loop);
  };
  fx.rafId = requestAnimationFrame(loop);
}
function drawFx(mode, dt) {
  const ctx = fx.ctx; if (!ctx) return;
  ctx.clearRect(0, 0, fx.w, fx.h);
  if (mode === "matrix") {
    ctx.font = "14px monospace";
    ctx.fillStyle = "rgba(0,255,102,0.15)";
    ctx.fillRect(0, 0, fx.w, fx.h);
    fx.particles.forEach(col => {
      col.y += col.speed * dt;
      if (col.y > fx.h + 300) { col.y = -20; }
      for (let i = 0; i < col.chars.length; i++) {
        const ch = col.chars[i];
        const y = col.y - i * 16;
        if (y < -20 || y > fx.h + 20) continue;
        ctx.fillStyle = i === 0 ? "rgba(200,255,220,0.9)" : `rgba(0,255,102,${Math.max(0.05, 0.6 - i*0.03)})`;
        ctx.fillText(ch, col.x, y);
        if (Math.random() < 0.02) col.chars[i] = String.fromCharCode(0x30A0 + Math.floor(Math.random()*96));
      }
    });
  } else if (mode === "galaxy") {
    fx.stars.forEach(s => {
      s.tw += dt * 2;
      const a = 0.4 + Math.abs(Math.sin(s.tw)) * 0.6;
      ctx.fillStyle = s.layer === 0 ? `rgba(139,92,246,${a})` : s.layer === 1 ? `rgba(56,189,248,${a})` : `rgba(244,114,182,${a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
      s.y += (s.layer + 1) * 3 * dt;
      if (s.y > fx.h) { s.y = 0; s.x = Math.random()*fx.w; }
    });
  } else if (mode === "ocean") {
    fx.bubbles.forEach(b => {
      b.y -= b.sp * dt;
      if (b.y < -10) { b.y = fx.h + 10; b.x = Math.random()*fx.w; }
      ctx.beginPath();
      ctx.arc(b.x + Math.sin(b.y/30)*5, b.y, b.r, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(0,194,255,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  } else if (mode === "gold") {
    fx.gold.forEach(p => {
      p.y -= p.sp * dt;
      p.x += Math.sin(p.y/40) * p.drift * dt;
      if (p.y < -10) { p.y = fx.h + 10; p.x = Math.random()*fx.w; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(212,175,55,0.5)";
      ctx.fill();
    });
  }
}

// ================= Beep =================
function ensureAudio() {
  if (state.audioCtx) return state.audioCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { state.audioCtx = new AC(); }
  } catch (e) {}
  return state.audioCtx;
}
document.addEventListener("click", () => {
  state.firstClickDone = true;
  const ac = ensureAudio();
  if (ac && ac.state === "suspended") { try { ac.resume(); } catch (e) {} }
}, { once: false });
function beep() {
  if (!state.firstClickDone) return;
  const ac = ensureAudio();
  if (!ac) return;
  try {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.12, ac.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.25);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + 0.3);
    const o2 = ac.createOscillator(); const g2 = ac.createGain();
    o2.type = "sine"; o2.frequency.value = 1320;
    g2.gain.setValueAtTime(0.0001, ac.currentTime + 0.1);
    g2.gain.exponentialRampToValueAtTime(0.09, ac.currentTime + 0.12);
    g2.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.35);
    o2.connect(g2); g2.connect(ac.destination);
    o2.start(ac.currentTime + 0.1); o2.stop(ac.currentTime + 0.4);
  } catch (e) {}
}

// ================= Router =================
const ROUTES = ["orders", "apps", "new", "customers", "sales", "io"];
let currentRoute = "";
function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  if (!h) return { route: "orders", params: [] };
  const parts = h.split("/");
  const route = parts[0] || "orders";
  return { route, params: parts.slice(1) };
}
function navigate(path) {
  if (location.hash === "#/" + path) { renderRoute(); return; }
  location.hash = "#/" + path;
}
function renderRoute() {
  const { route, params } = parseHash();
  const r = route === "edit" ? "edit" : route;
  // set active tab
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === (r === "edit" ? "apps" : r)));
  const view = $("#view");
  if (!view) return;
  currentRoute = r + (params[0] ? "/" + params[0] : "");
  if (!state.isAdmin) return;
  try {
    if (r === "orders") renderOrders(view);
    else if (r === "apps") renderApps(view);
    else if (r === "new") renderForm(view, null);
    else if (r === "edit") renderForm(view, params[0]);
    else if (r === "customers") renderCustomers(view);
    else if (r === "sales") renderSales(view);
    else if (r === "io") renderIO(view);
    else renderOrders(view);
  } catch (e) {
    console.error("Render error:", e);
    view.innerHTML = "";

function hideGateError() {

}
function showGateLoader(v) {
  const l = $("#gate-loader");

  if (!l || !b) return;

async function doLogin() {
  hideGateError();
  showGateLoader(true);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: "select_account" });
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    const code = e && e.code || "unknown";
    let msg = e && e.message || "Login fail";
    if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") msg = "Login window band ho gayi, dobara try karein";
    else if (code === "auth/popup-blocked") msg = "Browser me popup allow karein, phir dobara dabayein";
    else if (code === "auth/unauthorized-domain") msg = "Authentication -> Settings -> Authorized domains me is site ka domain jodein";
    else if (code === "auth/network-request-failed") msg = "Internet check karein";
    showGateError(code, msg);
  } finally {
    showGateLoader(false);
  }
}

// ================= Listeners =================
function stopListeners() {
  state.unsubscribers.forEach(u => { try { u(); } catch (e) {} });
  state.unsubscribers = [];
  state.listenersStarted = false;
  state.orders = {}; state.ordersFlat = []; state.apps = {}; state.purchases = {};
  state.lastOrderCount = -1;
}
function startListeners() {
  if (state.listenersStarted) return;
  state.listenersStarted = true;
  try {
    // Orders
    const ordersRef = ref(db, "orders");
    const un1 = onValue(ordersRef, (snap) => {
      const val = normalize(snap.val()) || {};
      state.orders = val;
      const flat = [];
      Object.entries(val).forEach(([uid, orders]) => {
        Object.entries(orders || {}).forEach(([orderId, o]) => {
          if (!o || typeof o !== "object") return;
          flat.push({ uid, orderId, ...o });
        });
      });
      flat.sort((a, b) => asNumber(b.createdAt) - asNumber(a.createdAt));
      state.ordersFlat = flat;
      updateOrdersBadge();
      // new order beep
      const pendingCount = flat.filter(o => o.status === "pending").length;
      if (state.lastOrderCount >= 0 && pendingCount > state.lastOrderCount) {
        beep();
        toast("Naya order aaya", "success");
      }
      state.lastOrderCount = pendingCount;
      if (currentRoute.startsWith("orders")) renderRoute();
    }, (err) => {
      console.error("orders err", err);
      if (currentRoute.startsWith("orders")) renderOrdersError(err);
    });
    state.unsubscribers.push(un1);

    // Apps
    const appsRef = ref(db, "paidApps");
    const un2 = onValue(appsRef, (snap) => {
      state.apps = normalize(snap.val()) || {};
      if (currentRoute.startsWith("apps") || currentRoute.startsWith("new") || currentRoute.startsWith("edit") || currentRoute.startsWith("orders")) renderRoute();
    }, (err) => { console.error("apps err", err); });
    state.unsubscribers.push(un2);

    // Purchases
    const purRef = ref(db, "purchases");
    const un3 = onValue(purRef, (snap) => {
      state.purchases = normalize(snap.val()) || {};
      if (currentRoute.startsWith("customers") || currentRoute.startsWith("sales") || currentRoute.startsWith("orders")) renderRoute();
    }, (err) => { console.error("purchases err", err); });
    state.unsubscribers.push(un3);

    // .info/connected
    const infoRef = ref(db, ".info/connected");
    const un4 = onValue(infoRef, (snap) => {
      if (!snap.val()) setOffline(true);
      else if (navigator.onLine) setOffline(false);
    });
    state.unsubscribers.push(un4);
  } catch (e) {
    console.error("startListeners err", e);
    toast("Listeners start nahi hue: " + e.message, "error");
  }
}
function updateOrdersBadge() {
  const pending = state.ordersFlat.filter(o => o.status === "pending").length;

// ---------- ORDERS ----------
function renderOrders(view) {
  view.innerHTML = "";
  const header = el("div", { class: "panel" });
  const headRow = el("div", { class: "panel-head" });
  const titleWrap = el("div");
  titleWrap.append(
    el("h2", { class: "panel-title", text: "Orders" }),
    el("p", { class: "panel-sub", text: "Pehle apne UPI/bank app me UTR aur amount check karein, phir Approve karein." })
  );
  headRow.append(titleWrap);
  header.append(headRow);

  const pendingCount = state.ordersFlat.filter(o => o.status === "pending").length;
  const approvedCount = state.ordersFlat.filter(o => o.status === "approved").length;
  const rejectedCount = state.ordersFlat.filter(o => o.status === "rejected" || o.status === "revoked").length;

  const filters = el("div", { class: "filters" });
  const filterDefs = [
    { key: "pending", label: "Pending", count: pendingCount },
    { key: "approved", label: "Approved", count: approvedCount },
    { key: "rejected", label: "Rejected / Revoked", count: rejectedCount }
  ];
  const currentFilter = window.__ordersFilter || "pending";
  filterDefs.forEach(f => {
    const b = el("button", { class: "filter-btn" + (currentFilter === f.key ? " active" : "") });
    b.append(document.createTextNode(f.label + " "));
    b.append(el("span", { class: "count", text: String(f.count) }));
    b.addEventListener("click", () => { window.__ordersFilter = f.key; renderOrders(view); });
    filters.append(b);
  });
  header.append(filters);
  view.append(header);

  // Filter orders
  let orders = state.ordersFlat;
  if (currentFilter === "pending") orders = orders.filter(o => o.status === "pending");
  else if (currentFilter === "approved") orders = orders.filter(o => o.status === "approved");
  else orders = orders.filter(o => o.status === "rejected" || o.status === "revoked");

  if (orders.length === 0) {
    const empty = el("div", { class: "panel empty" });
    empty.append(el("div", { class: "big", text: "📭" }), el("div", { text: "Abhi koi order nahi" }));
    view.append(empty);
    return;
  }

  const list = el("div");
  orders.forEach(o => list.append(orderCard(o, view)));
  view.append(list);
}

function orderCard(o, view) {
  const appPrice = getAppPrice(o.appId);
  const amount = asNumber(o.amount, 0);
  const card = el("div", { class: "card" });

  const head = el("div", { class: "card-head" });
  const left = el("div", { style: "min-width:0" });
  left.append(
    el("h3", { class: "card-title", text: getAppName(o.appId) }),
    el("div", { class: "card-meta", text: asString(o.email, o.uid || "") }),
    el("div", { class: "card-meta", text: fmtDate(asNumber(o.createdAt)) + (o.createdAt ? " · " + fmtAgo(asNumber(o.createdAt)) : "") })
  );
  head.append(left);

  const right = el("div", { class: "row" });
  const statusClass = o.status === "pending" ? "pending" : o.status === "approved" ? "approved" : (o.status === "rejected" || o.status === "revoked") ? "rejected" : "";
  right.append(el("span", { class: "chip " + statusClass, text: asString(o.status, "unknown").toUpperCase() }));
  head.append(right);
  card.append(head);

  // Amount vs price
  const amountRow = el("div", { class: "row", style: "margin-top:10px;gap:10px" });
  amountRow.append(el("span", { class: "price-badge", text: fmtINR(amount) }));
  if (appPrice === null) {
    amountRow.append(el("span", { class: "flag warning", text: "App ab exist nahi karta" }));
  } else if (amount < appPrice) {
    amountRow.append(el("span", { class: "flag danger", text: "Amount price se kam hai (app price: " + fmtINR(appPrice) + ")" }));
  } else if (amount >= appPrice) {
    amountRow.append(el("span", { class: "flag success", text: "✓ Amount sahi hai (app price: " + fmtINR(appPrice) + ")" }));
  }
  card.append(amountRow);

  // UTR
  const utrRow = el("div", { class: "utr-row", style: "margin-top:10px" });
  utrRow.append(el("span", { class: "text-dim", text: "UTR:", style: "font-size:12px" }));
  utrRow.append(el("span", { class: "utr", text: asString(o.utr, "—") }));
  const copyBtn = el("button", { class: "btn btn-sm", text: "Copy" });
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(asString(o.utr, ""));
      toast("UTR copy ho gaya", "success");
    } catch (e) {
      toast("Copy fail: " + e.message, "error");
    }
  });
  utrRow.append(copyBtn);
  card.append(utrRow);

  // Duplicate UTR flag
  const dup = findDuplicateUTR(o.utr, o.uid + "/" + o.orderId);
  if (dup) card.append(el("div", { class: "flag danger", style: "margin-top:8px", text: "⚠ Ye UTR pehle bhi use hua hai" }));

  // Note
  if (o.note) card.append(el("div", { class: "card-meta", style: "margin-top:8px", text: "Note: " + o.note }));

  // Actions
  const actions = el("div", { class: "row", style: "margin-top:12px;gap:8px" });
  if (o.status === "pending") {
    const approveBtn = el("button", { class: "btn btn-success btn-sm", text: "Approve", disabled: isWriteDisabled() ? true : undefined });
    approveBtn.addEventListener("click", () => approveOrder(o, view));
    const rejectBtn = el("button", { class: "btn btn-danger btn-sm", text: "Reject", disabled: isWriteDisabled() ? true : undefined });
    rejectBtn.addEventListener("click", () => rejectOrder(o, view));
    actions.append(approveBtn, rejectBtn);
  } else if (o.status === "approved") {
    const revokeBtn = el("button", { class: "btn btn-danger btn-sm", text: "Revoke", disabled: isWriteDisabled() ? true : undefined });
    revokeBtn.addEventListener("click", () => revokeOrder(o, view));
    actions.append(revokeBtn);
  }
  if (actions.children.length) card.append(actions);

  return card;
}

async function approveOrder(o, view) {
  const ok = await showConfirm({
    title: "Order approve karein?",
    body: getAppName(o.appId) + " · " + fmtINR(o.amount) + " · UTR: " + o.utr + "\nPehle UPI/bank app me verify karein.",
    okText: "Haan, Approve",
    danger: false
  });
  if (!ok.ok) return;
  if (isWriteDisabled()) { toast("Abhi save nahi ho sakta", "error"); return; }
  pauseTheme("save");
  const success = await guardedWrite(async () => {
    const updates = {};
    updates["orders/" + o.uid + "/" + o.orderId + "/status"] = "approved";
    updates["orders/" + o.uid + "/" + o.orderId + "/approvedAt"] = serverTimestamp();
    updates["purchases/" + o.uid + "/" + o.appId] = {
      orderId: o.orderId,
      amount: asNumber(o.amount, 0),
      approvedAt: serverTimestamp()
    };
    await update(ref(db), updates);
  });
  resumeTheme("save");
  if (success) toast("Approve ho gaya, user ke liye app unlock", "success");
  renderOrders(view);
}

async function rejectOrder(o, view) {
  const res = await showConfirm({
    title: "Order reject karein?",
    body: "Reason optional hai. User ko dikhaya jayega.",
    okText: "Reject karein",
    danger: true,
    input: true,
    inputPlaceholder: "Reason (optional)"
  });
  if (!res.ok) return;
  if (isWriteDisabled()) { toast("Abhi save nahi ho sakta", "error"); return; }
  pauseTheme("save");
  const success = await guardedWrite(async () => {
    const updates = {};
    updates["orders/" + o.uid + "/" + o.orderId + "/status"] = "rejected";
    if (res.input && trim(res.input)) updates["orders/" + o.uid + "/" + o.orderId + "/note"] = trim(res.input);
    await update(ref(db), updates);
  });
  resumeTheme("save");
  if (success) toast("Order reject ho gaya", "success");
  renderOrders(view);
}

async function revokeOrder(o, view) {
  const ok = await showConfirm({
    title: "Access revoke karein?",
    body: getAppName(o.appId) + " · " + fmtINR(o.amount) + "\nUser ka access band ho jayega (purchase hat jayegi).",
    okText: "Haan, Revoke",
    danger: true
  });
  if (!ok.ok) return;
  if (isWriteDisabled()) { toast("Abhi save nahi ho sakta", "error"); return; }
  pauseTheme("save");
  const success = await guardedWrite(async () => {
    const updates = {};
    updates["orders/" + o.uid + "/" + o.orderId + "/status"] = "revoked";
    updates["purchases/" + o.uid + "/" + o.appId] = null;
    await update(ref(db), updates);
  });
  resumeTheme("save");
  if (success) toast("Access revoke ho gaya", "success");
  renderOrders(view);
}

// ---------- APPS ----------
function renderApps(view) {
  view.innerHTML = "";

  const allApps = Object.entries(state.apps || {}).map(([id, a]) => ({ id, ...a }));

  const free = allApps.filter(a => asNumber(a.price, 0) === 0).length;
  const paid = total - free;
  const hidden = allApps.filter(a => !toBool(a.published)).length;

  // Summary panel
  const sumPanel = el("div", { class: "panel" });
  sumPanel.append(el("h2", { class: "panel-title", text: "Apps" }));
  const stats = el("div", { class: "stat-grid", style: "margin-top:12px" });
  const statDefs = [
    { label: "Total", value: total },
    { label: "Free", value: free },
    { label: "Paid", value: paid },
    { label: "Hidden", value: hidden }
  ];
  statDefs.forEach(s => {
    const c = el("div", { class: "stat-card" });
    c.append(el("div", { class: "label", text: s.label }), el("div", { class: "value", text: String(s.value) }));
    stats.append(c);
  });
  sumPanel.append(stats);

  // Search + filters
  const controls = el("div", { class: "filters", style: "margin-top:12px" });
  const searchWrap = el("div", { class: "search-wrap" });
  const searchInput = el("input", { class: "input", type: "search", placeholder: "Name / package / publisher search...", value: window.__appsSearch || "" });
  searchInput.addEventListener("input", () => { window.__appsSearch = searchInput.value; renderApps(view); searchInput.focus(); searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length); });
  searchWrap.append(searchInput);
  controls.append(searchWrap);

  const filterDefs = ["All", "Free", "Paid", "Published", "Hidden"];
  const curFilter = window.__appsFilter || "All";
  filterDefs.forEach(f => {
    const b = el("button", { class: "filter-btn" + (curFilter === f ? " active" : ""), text: f });
    b.addEventListener("click", () => { window.__appsFilter = f; renderApps(view); });
    controls.append(b);
  });

  const sortSel = el("select", { class: "select", style: "max-width:180px" });
  [["newest", "Newest"], ["az", "A-Z"], ["price-desc", "Price high to low"]].forEach(([v, l]) => {
    const opt = el("option", { value: v, text: l });
    if ((window.__appsSort || "newest") === v) opt.selected = true;
    sortSel.append(opt);
  });
  sortSel.addEventListener("change", () => { window.__appsSort = sortSel.value; renderApps(view); });
  controls.append(sortSel);

  sumPanel.append(controls);
  view.append(sumPanel);

  // Filter apps
  let apps = allApps;
  const q = (window.__appsSearch || "").toLowerCase().trim();
  if (q) apps = apps.filter(a => (asString(a.name) + " " + asString(a.packageName) + " " + asString(a.publisher)).toLowerCase().includes(q));
  if (curFilter === "Free") apps = apps.filter(a => asNumber(a.price, 0) === 0);
  else if (curFilter === "Paid") apps = apps.filter(a => asNumber(a.price, 0) > 0);
  else if (curFilter === "Published") apps = apps.filter(a => toBool(a.published));
  else if (curFilter === "Hidden") apps = apps.filter(a => !toBool(a.published));

  const sortKey = window.__appsSort || "newest";
  if (sortKey === "az") apps.sort((a, b) => asString(a.name).localeCompare(asString(b.name)));
  else if (sortKey === "price-desc") apps.sort((a, b) => asNumber(b.price) - asNumber(a.price));
  else apps.sort((a, b) => asNumber(b.createdAt) - asNumber(a.createdAt));

  if (apps.length === 0) {
    const empty = el("div", { class: "panel empty" });
    empty.append(el("div", { class: "big", text: "📱" }), el("div", { text: "Abhi koi app nahi. 'Naya app' se pehla app jodein" }));
    view.append(empty);
    return;
  }

  const list = el("div");
  apps.forEach(a => list.append(appRow(a, view)));
  view.append(list);
}

function appRow(a, view) {
  const card = el("div", { class: "card" });
  const row = el("div", { class: "app-row" });

  // Icon
  let icon;
  if (a.icon && /^https?:\/\//.test(a.icon)) {
    icon = el("img", { class: "app-icon", src: a.icon, alt: "", loading: "lazy" });
    icon.addEventListener("error", () => { icon.replaceWith(letterAvatar(a.name)); }, { once: true });
  } else {
    icon = letterAvatar(a.name);
  }
  row.append(icon);

  // Info
  const info = el("div", { class: "app-info" });
  info.append(

// ---------- APK Reader (tested code as is) ----------
const MAX_TAIL = 70000;
const MAX_CD = 32 * 1024 * 1024;
const MAX_MANIFEST = 16 * 1024 * 1024;

function withTimeout(promise, ms, msg) {
  let t;
  const timer = new Promise((_, rej) => { t = setTimeout(() => rej(new Error(msg || "timeout")), ms); });
  return Promise.race([promise, timer]).finally(() => clearTimeout(t));
}
async function readBytes(blob, start, end) {
  return new Uint8Array(await blob.slice(start, end).arrayBuffer());
}
async function inflateRaw(bytes) {
  if (typeof DecompressionStream === "function") {
    try {
      const ds = new DecompressionStream("deflate-raw");
      const out = new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
      return new Uint8Array(await withTimeout(out, 8000, "inflate timeout"));
    } catch (e) { /* neeche fallback */ }
  }
  const m = await withTimeout(import("https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"), 8000, "lib timeout");
  return m.inflateSync(bytes);
}
async function findManifest(file) {
  const size = file.size;
  if (size < 22) throw new Error("File bahut chhoti hai");
  const tailStart = Math.max(0, size - MAX_TAIL);
  const tail = await readBytes(file, tailStart, size);
  const tdv = new DataView(tail.buffer, tail.byteOffset, tail.byteLength);
  let eocd = -1;
  for (let i = tail.length - 22; i >= 0; i--) {
    if (tdv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Ye valid APK/zip nahi lag raha");
  const entries = tdv.getUint16(eocd + 10, true);
  const cdSize = tdv.getUint32(eocd + 12, true);
  const cdOffset = tdv.getUint32(eocd + 16, true);
  if (cdSize === 0xffffffff || cdOffset === 0xffffffff || entries === 0xffff) throw new Error("ZIP64 APK abhi support nahi");
  if (cdSize > MAX_CD || cdOffset + cdSize > size) throw new Error("Central directory kharab hai");
  const cd = await readBytes(file, cdOffset, cdOffset + cdSize);
  const dv = new DataView(cd.buffer, cd.byteOffset, cd.byteLength);
  const dec = new TextDecoder("utf-8");
  let p = 0;
  for (let n = 0; n < entries && p + 46 <= cd.length; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(cd.subarray(p + 46, p + 46 + nameLen));
    if (name === "AndroidManifest.xml") {
      if (compSize > MAX_MANIFEST) throw new Error("Manifest bahut bada hai");
      const lh = await readBytes(file, localOff, localOff + 30);
      const ldv = new DataView(lh.buffer, lh.byteOffset, lh.byteLength);
      if (ldv.getUint32(0, true) !== 0x04034b50) throw new Error("Local header kharab hai");
      const dataStart = localOff + 30 + ldv.getUint16(26, true) + ldv.getUint16(28, true);
      const raw = await readBytes(file, dataStart, dataStart + compSize);
      if (method === 0) return raw;
      if (method === 8) return await inflateRaw(raw);
      throw new Error("Anjaan compression (" + method + ")");
    }
    p += 46 + nameLen + extraLen + commentLen;
  }
  throw new Error("AndroidManifest.xml nahi mila");
}
function parseAxml(buf) {
  const len = buf.length;
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  if (len < 16 || dv.getUint16(0, true) !== 0x0003) throw new Error("Manifest ka format samajh nahi aaya");
  const strings = [];
  const u32 = o => dv.getUint32(o, true);
  const u16 = o => dv.getUint16(o, true);
  let pos = u16(2) || 8;
  let guard = 0;
  while (pos + 8 <= len && guard++ < 200000) {
    const type = u16(pos), hdr = u16(pos + 2), size = u32(pos + 4);
    if (size < 8 || pos + size > len) break;
    if (type === 0x0001) {
      const count = Math.min(u32(pos + 8), 200000);
      const utf8 = (u32(pos + 16) & 0x100) !== 0;
      const strStart = pos + u32(pos + 20);
      const offs = pos + hdr;
      const u8dec = new TextDecoder("utf-8"), u16dec = new TextDecoder("utf-16le");
      for (let i = 0; i < count; i++) {
        let sp = strStart + u32(offs + 4 * i), s = "";
        if (sp >= len) { strings.push(""); continue; }
        if (utf8) {
          let c = buf[sp++]; if (c & 0x80) sp++;
          let b = buf[sp++]; if (b & 0x80) b = ((b & 0x7f) << 8) | buf[sp++];
          if (sp + b <= len) s = u8dec.decode(buf.subarray(sp, sp + b));
        } else {
          let l = u16(sp); sp += 2;
          if (l & 0x8000) { l = ((l & 0x7fff) << 16) | u16(sp); sp += 2; }
          if (sp + l * 2 <= len) s = u16dec.decode(buf.subarray(sp, sp + l * 2));
        }
        strings.push(s);
      }
    } else if (type === 0x0102) {
      if (strings[u32(pos + 20)] === "manifest") {
        const attrStart = u16(pos + 24), attrSize = u16(pos + 26), attrCount = Math.min(u16(pos + 28), 200);
        const out = { packageName: "", versionCode: 0, versionName: "" };
        for (let k = 0; k < attrCount; k++) {
          const a = pos + 16 + attrStart + k * (attrSize || 20);
          if (a + 20 > len) break;
          const name = strings[u32(a + 4)];
          const raw = u32(a + 8), dtype = buf[a + 15], data = u32(a + 16);
          const str = () => strings[raw !== 0xffffffff ? raw : data] || "";
          if (name === "package") out.packageName = dtype === 0x03 || raw !== 0xffffffff ? str() : "";
          else if (name === "versionName") out.versionName = str();
          else if (name === "versionCode") out.versionCode = (dtype === 0x10 || dtype === 0x11) ? data : (parseInt(str(), 10) || 0);
        }
        return out;
      }
    }
    pos += size;
  }
  throw new Error("Manifest me package nahi mila");
}
async function readApkInfo(file) {
  const run = async () => {
    const manifest = await findManifest(file);
    const info = parseAxml(manifest);
    return { ...info, sizeBytes: file.size };
  };
  return withTimeout(run(), 15000, "APK padhne me bahut der lagi");
}
async function computeSha256(file) {
  if (file.size > 150 * 1024 * 1024) return null;
  try {
    const buf = await file.arrayBuffer();
    const hash = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) { return null; }
}
