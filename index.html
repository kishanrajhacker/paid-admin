  form.append(fieldWrap("Screenshots (ek URL per line)", screenshotsInput, "f_screenshots", false));

  // Switches
  const switchRow = el("div", { class: "row", style: "margin-top:8px;gap:20px;flex-wrap:wrap" });
  const pubSwitchWrap = el("label", { class: "switch" });
  const pubChk = el("input", { type: "checkbox", id: "f_published" });
  pubChk.checked = existing ? toBool(existing.published) : true;
  pubSwitchWrap.append(pubChk, el("span", { class: "track" }), document.createTextNode(" Published"));
  switchRow.append(pubSwitchWrap);

  const featSwitchWrap = el("label", { class: "switch" });
  const featChk = el("input", { type: "checkbox", id: "f_featured" });
  featChk.checked = existing ? toBool(existing.featured) : false;
  featSwitchWrap.append(featChk, el("span", { class: "track" }), document.createTextNode(" Featured"));
  switchRow.append(featSwitchWrap);
  form.append(switchRow);

  // Actions
  const actions = el("div", { class: "form-actions" });
  const saveBtn = el("button", { type: "submit", class: "btn btn-primary", text: isEdit ? "Save changes" : "App save karein" });
  const cancelBtn = el("button", { type: "button", class: "btn", text: "Cancel" });
  cancelBtn.addEventListener("click", () => navigate("apps"));
  actions.append(saveBtn, cancelBtn);
  form.append(actions);

  const saveStatus = el("div", { id: "f_save_status", style: "margin-top:10px" });
  form.append(saveStatus);

  panel.append(form);
  view.append(panel);

  // Load premiumLinks for edit
  if (isEdit && editId) {
    const linkRef = ref(db, "premiumLinks/" + editId);
    get(linkRef).then((snap) => {
      const v = normalize(snap.val()) || {};
      if (v.apkUrl) apkUrlInput.value = v.apkUrl;
      if (v.sha256) shaInput.value = v.sha256;
    }).catch(err => {
      console.warn("premiumLinks read fail:", err);
    });
  }

  // saveApp function (closure)
  async function saveApp() {
    // clear errors
    $$(".field-error").forEach(e => { e.textContent = ""; e.classList.remove("show"); });
    $$(".input.error, .textarea.error").forEach(e => e.classList.remove("error"));

    const errs = [];
    function addErr(id, msg) {
      const e = document.getElementById(id + "_err");
      if (e) { e.textContent = msg; e.classList.add("show"); }
      const inp = document.getElementById(id);
      if (inp) inp.classList.add("error");
      errs.push(msg);
    }

    const name = trim(document.getElementById("f_name").value);
    const pkg = trim(document.getElementById("f_pkg").value);
    const vc = parseInt(document.getElementById("f_versionCode").value, 10);
    const version = trim(document.getElementById("f_version").value);
    const size = trim(document.getElementById("f_size").value);
    const sizeBytes = parseInt(document.getElementById("f_sizeBytes").value, 10) || 0;
    const category = trim(document.getElementById("f_category").value);
    const publisher = trim(document.getElementById("f_publisher").value);
    const rating = parseFloat(document.getElementById("f_rating").value);
    const downloads = trim(document.getElementById("f_downloads").value);
    const price = parseInt(document.getElementById("f_price").value, 10);
    const icon = trim(document.getElementById("f_icon").value);
    const apkUrl = trim(document.getElementById("f_apkUrl").value);
    const sha256 = trim(document.getElementById("f_sha256").value).toLowerCase();
    const description = trim(document.getElementById("f_description").value);
    const fullDescription = trim(document.getElementById("f_fullDescription").value);
    const whatsNew = trim(document.getElementById("f_whatsNew").value);
    const screenshotsRaw = document.getElementById("f_screenshots").value;
    const published = document.getElementById("f_published").checked;
    const featured = document.getElementById("f_featured").checked;

    if (!name) addErr("f_name", "Name required");
    if (!pkg) addErr("f_pkg", "Package required");
    else if (!PKG_RE.test(pkg)) addErr("f_pkg", "Package format galat (com.example.app)");
    if (!Number.isInteger(vc) || vc < 1) addErr("f_versionCode", "versionCode integer ≥ 1 hona chahiye");
    if (!Number.isInteger(price) || price < 0) addErr("f_price", "Price integer ≥ 0 (0 = free)");
    if (!apkUrl) addErr("f_apkUrl", "APK URL required");
    else if (!/^https:\/\//.test(apkUrl)) addErr("f_apkUrl", "APK URL https:// se shuru hona chahiye");
    if (icon && !/^https?:\/\//.test(icon)) addErr("f_icon", "Icon URL https only");
    if (sha256 && !HEX64_RE.test(sha256)) addErr("f_sha256", "SHA-256 lowercase 64 hex hona chahiye");
    if (!isNaN(rating) && (rating < 0 || rating > 5)) addErr("f_rating", "Rating 0-5");

    const screenshots = screenshotsRaw.split("\n").map(s => trim(s)).filter(Boolean);
    for (const s of screenshots) {
      if (!/^https?:\/\//.test(s)) { addErr("f_screenshots", "Screenshot URL https only"); break; }
    }

    if (errs.length) { toast("Form me errors hain", "error"); return; }

    // Duplicate packageName warning (non-blocking)
    const dupPkg = Object.entries(state.apps || {}).find(([id, a]) => a.packageName === pkg && id !== editId);
    if (dupPkg) toast("Warning: ye packageName pehle se hai (" + dupPkg[0] + ")", "info", 4000);

    if (isWriteDisabled()) { toast("Abhi save nahi ho sakta", "error"); return; }

    // SAVE BUG protection
    let appId;
    try {
      appId = editId || push(ref(db, "paidApps")).key;
      if (typeof appId !== "string" || !appId) throw new Error("App id nahi bani");
    } catch (e) {
      toast("App id error: " + e.message, "error");
      return;
    }

    const appData = cleanUndefined({
      name, packageName: pkg, versionCode: vc, version,
      size, sizeBytes: sizeBytes || undefined,
      category, publisher,
      rating: isNaN(rating) ? undefined : rating,
      downloads, icon, description, fullDescription, whatsNew,
      screenshots: screenshots.length ? screenshots : undefined,
      price, published, featured,
      createdAt: existing?.createdAt || serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    const linkData = cleanUndefined({ apkUrl, sha256: sha256 || undefined });

    saveBtn.disabled = true;
    saveBtn.innerHTML = "";
    saveBtn.append(createLoader(18), document.createTextNode(" Saving..."));
    saveStatus.innerHTML = "";
    pauseTheme("save");

    try {
      const updates = {};
      updates["paidApps/" + appId] = appData;
      updates["premiumLinks/" + appId] = linkData;
      await update(ref(db), updates);
      toast("App save ho gaya", "success");
      sessionStorage.removeItem("apkstore_newver_" + appId);
      navigate("apps");
    } catch (e) {
      console.error("save err", e);
      const code = (e && (e.code || e.message)) || "error";
      let msg = "Save nahi hua: " + code;
      if (String(code).includes("permission")) msg = "Permission denied — rules publish karein";
      toast(msg, "error", 5000);
      saveBtn.disabled = false;
      saveBtn.textContent = "Retry save";
    } finally {
      resumeTheme("save");
    }
  }
}

// ---------- CUSTOMERS ----------
function renderCustomers(view) {
  view.innerHTML = "";

  // Build email map from orders
  const emailByUid = {};
  state.ordersFlat.forEach(o => { if (o.uid && o.email) emailByUid[o.uid] = o.email; });

  // Group purchases by uid
  const customers = [];
  Object.entries(state.purchases || {}).forEach(([uid, apps]) => {
    const appsObj = apps && typeof apps === "object" ? apps : {};
    const appEntries = Object.entries(appsObj);
    if (appEntries.length === 0) return;
    let totalSpent = 0;
    const appsList = appEntries.map(([appId, p]) => {
      const amt = asNumber(p && p.amount, 0);
      totalSpent += amt;
      return { appId, amount: amt, name: getAppName(appId) };
    });
    customers.push({ uid, email: emailByUid[uid] || uid, apps: appsList, totalSpent });
  });
  customers.sort((a, b) => b.totalSpent - a.totalSpent);

  const panel = el("div", { class: "panel" });
  panel.append(el("h2", { class: "panel-title", text: "Customers" }), el("p", { class: "panel-sub", text: "Total " + customers.length + " customers" }));

  const searchInput = el("input", { class: "input", type: "search", placeholder: "Email se search...", value: window.__custSearch || "" });
  searchInput.addEventListener("input", () => { window.__custSearch = searchInput.value; renderCustomers(view); searchInput.focus(); });
  panel.append(searchInput);
  view.append(panel);

  let list = customers;
  const q = (window.__custSearch || "").toLowerCase().trim();
  if (q) list = list.filter(c => c.email.toLowerCase().includes(q) || c.uid.toLowerCase().includes(q));

  if (list.length === 0) {
    const empty = el("div", { class: "panel empty" });
    empty.append(el("div", { class: "big", text: "👥" }), el("div", { text: "Abhi koi customer nahi" }));
    view.append(empty);
    return;
  }

  const cont = el("div");
  list.forEach(c => {
    const card = el("div", { class: "card" });
    const head = el("div", { class: "card-head" });
    head.append(el("div", { class: "card-title", text: c.email }));
    head.append(el("span", { class: "price-badge", text: fmtINR(c.totalSpent) }));
    card.append(head);
    card.append(el("div", { class: "card-meta", text: c.apps.length + " app · UID: " + c.uid.slice(0, 10) + "..." }));

    const appsDiv = el("div", { style: "margin-top:10px" });
    c.apps.forEach(a => {
      const row = el("div", { class: "row", style: "padding:8px 0;border-top:1px solid var(--border);justify-content:space-between" });
      row.append(el("span", { text: a.name + " · " + fmtINR(a.amount) }));
      const revBtn = el("button", { class: "btn btn-sm btn-danger", text: "Revoke", disabled: isWriteDisabled() ? true : undefined });
      revBtn.addEventListener("click", async () => {
        const ok = await showConfirm({
          title: "Access revoke karein?",
          body: c.email + " ka " + a.name + " access hat jayega.",
          okText: "Haan, Revoke",
          danger: true
        });
        if (!ok.ok) return;
        const success = await guardedWrite(async () => {
          await set(ref(db, "purchases/" + c.uid + "/" + a.appId), null);
        });
        if (success) { toast("Revoke ho gaya", "success"); renderCustomers(view); }
      });
      row.append(revBtn);
      appsDiv.append(row);
    });
    card.append(appsDiv);
    cont.append(card);
  });
  view.append(cont);
}

// ---------- SALES ----------
function renderSales(view) {
  view.innerHTML = "";
  const approved = state.ordersFlat.filter(o => o.status === "approved");
  const pendingOrders = state.ordersFlat.filter(o => o.status === "pending");

  const now = Date.now();
  const startToday = new Date(); startToday.setHours(0, 0, 0, 0);
  const todayTs = startToday.getTime();
  const weekAgo = now - 7 * 24 * 60 * 60 * 1000;
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0, 0, 0, 0);
  const monthTs = monthStart.getTime();

  let totalRev = 0, todayRev = 0, weekRev = 0, monthRev = 0;
  const perApp = {};
  approved.forEach(o => {
    const amt = asNumber(o.amount, 0);
    const ts = asNumber(o.approvedAt) || asNumber(o.createdAt);
    totalRev += amt;
    if (ts >= todayTs) todayRev += amt;
    if (ts >= weekAgo) weekRev += amt;
    if (ts >= monthTs) monthRev += amt;
    if (!perApp[o.appId]) perApp[o.appId] = { count: 0, revenue: 0, name: getAppName(o.appId) };
    perApp[o.appId].count++;
    perApp[o.appId].revenue += amt;
  });
  const pendingValue = pendingOrders.reduce((s, o) => s + asNumber(o.amount, 0), 0);

  const panel = el("div", { class: "panel" });
  panel.append(el("h2", { class: "panel-title", text: "Sales" }), el("p", { class: "panel-sub", text: "Approved orders se calculate" }));

  const stats = el("div", { class: "stat-grid" });
  [
    { label: "Total revenue", value: fmtINR(totalRev), price: true },
    { label: "Total orders", value: String(approved.length) },
    { label: "Aaj", value: fmtINR(todayRev), price: true },
    { label: "Last 7 din", value: fmtINR(weekRev), price: true },
    { label: "Is mahine", value: fmtINR(monthRev), price: true },
    { label: "Pending value", value: fmtINR(pendingValue), price: true }
  ].forEach(s => {
    const c = el("div", { class: "stat-card" });
    c.append(el("div", { class: "label", text: s.label }), el("div", { class: "value" + (s.price ? " price" : ""), text: s.value }));
    stats.append(c);
  });
  panel.append(stats);

  // Per-app table
  const appList = Object.entries(perApp).sort((a, b) => b[1].revenue - a[1].revenue);
  if (appList.length > 0) {
    const tbl = el("div", { style: "margin-top:16px" });
    tbl.append(el("div", { class: "card-title", text: "App-wise sales" }));
    const maxRev = Math.max(...appList.map(a => a[1].revenue), 1);
    const chart = el("div", { style: "margin-top:12px" });
    appList.forEach(([appId, d]) => {
      const row = el("div", { style: "margin-bottom:10px" });
      const label = el("div", { class: "row", style: "justify-content:space-between;font-size:12px" });
      label.append(el("span", { text: d.name }), el("span", { class: "mono", text: d.count + " orders · " + fmtINR(d.revenue) }));
      row.append(label);
      const barWrap = el("div", { style: "height:8px;background:var(--surface-solid);border-radius:4px;overflow:hidden;margin-top:4px;border:1px solid var(--border)" });
      const bar = el("div", { style: "height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:" + ((d.revenue / maxRev) * 100).toFixed(1) + "%;transition:width .5s" });
      barWrap.append(bar);
      row.append(barWrap);
      chart.append(row);
    });
    tbl.append(chart);
    panel.append(tbl);
  } else {
    panel.append(el("div", { class: "empty", text: "Abhi koi approved sale nahi" }));
  }

  view.append(panel);
}

// ---------- IMPORT / EXPORT ----------
function renderIO(view) {
  view.innerHTML = "";
  const panel = el("div", { class: "panel" });
  panel.append(el("h2", { class: "panel-title", text: "Import / Export" }), el("p", { class: "panel-sub", text: "Apps ka JSON backup lein ya restore karein (apk links ke bina)" }));

  // Export
  const expCard = el("div", { class: "card" });
  expCard.append(el("div", { class: "card-title", text: "Export JSON" }));
  expCard.append(el("div", { class: "card-meta", text: "Sirf paidApps (price ke saath), apk links nahi." }));
  const expBtn = el("button", { class: "btn btn-primary btn-sm", style: "margin-top:10px", text: "Export / Copy JSON" });
  expBtn.addEventListener("click", async () => {
    const out = {};
    Object.entries(state.apps || {}).forEach(([id, a]) => {
      out[id] = {
        name: a.name, packageName: a.packageName, versionCode: a.versionCode, version: a.version,
        size: a.size, category: a.category, publisher: a.publisher, rating: a.rating,
        downloads: a.downloads, icon: a.icon, description: a.description,
        fullDescription: a.fullDescription, whatsNew: a.whatsNew,
        screenshots: a.screenshots, price: a.price, published: a.published, featured: a.featured
      };
    });
    const json = JSON.stringify(out, null, 2);
    let copied = false;
    try { await navigator.clipboard.writeText(json); copied = true; } catch (e) {}
    if (!copied) {
      // textarea fallback
      const ta = el("textarea", { class: "textarea", style: "margin-top:10px;min-height:200px;font-family:var(--font-mono);font-size:11px" });
      ta.value = json;
      expCard.append(ta);
      ta.select();
      try { document.execCommand("copy"); copied = true; } catch (e) {}
    }
    toast(copied ? "JSON copy ho gaya (" + Object.keys(out).length + " apps)" : "Copy fail, textarea se manually copy karein", copied ? "success" : "error", 5000);
  });
  expCard.append(expBtn);
  panel.append(expCard);

  // Import
  const impCard = el("div", { class: "card" });
  impCard.append(el("div", { class: "card-title", text: "Import JSON" }));
  impCard.append(el("div", { class: "card-meta", text: "Array ya {id: app} object. Duplicate packageName skip honge." }));
  const ta = el("textarea", { class: "textarea", style: "margin-top:10px;min-height:180px;font-family:var(--font-mono);font-size:12px", placeholder: '[{"name":"...","packageName":"com.x.y","price":49,...}]' });
  impCard.append(ta);
  const preview = el("div", { class: "card-meta", style: "margin-top:8px" });
  const impBtn = el("button", { class: "btn btn-primary btn-sm", style: "margin-top:10px", text: "Import karein", disabled: isWriteDisabled() ? true : undefined });
  impBtn.addEventListener("click", async () => {
    let data;
    try { data = JSON.parse(ta.value); }
    catch (e) { toast("JSON parse fail: " + e.message, "error"); return; }
    let arr = Array.isArray(data) ? data : Object.values(data || {});
    arr = arr.filter(x => x && typeof x === "object" && x.name && x.packageName);
    if (arr.length === 0) { toast("Koi valid app nahi mila", "error"); return; }
    preview.textContent = arr.length + " apps ready. Import dabayein.";
    let imported = 0, skipped = 0;
    const existingPkgs = new Set(Object.values(state.apps || {}).map(a => a.packageName));
    for (const a of arr) {
      if (existingPkgs.has(a.packageName)) { skipped++; continue; }
      try {
        let appId;
        try {
          appId = push(ref(db, "paidApps")).key;
          if (typeof appId !== "string" || !appId) throw new Error("App id nahi bani");
        } catch (e) { skipped++; continue; }
        const appData = cleanUndefined({
          name: asString(a.name), packageName: asString(a.packageName),
          versionCode: asNumber(a.versionCode, 1), version: asString(a.version),
          size: asString(a.size), sizeBytes: asNumber(a.sizeBytes, 0) || undefined,
          category: asString(a.category), publisher: asString(a.publisher),
          rating: asNumber(a.rating, 0), downloads: asString(a.downloads),
          icon: asString(a.icon), description: asString(a.description),
          fullDescription: asString(a.fullDescription), whatsNew: asString(a.whatsNew),
          screenshots: normalizeArray(a.screenshots).filter(Boolean),
          price: asNumber(a.price, 0), published: toBool(a.published),
          featured: toBool(a.featured),
          createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        });
        const updates = {};
        updates["paidApps/" + appId] = appData;
        if (a.apkUrl && /^https:\/\//.test(a.apkUrl)) {
          updates["premiumLinks/" + appId] = cleanUndefined({ apkUrl: a.apkUrl, sha256: a.sha256 || undefined });
        }
        await update(ref(db), updates);
        existingPkgs.add(a.packageName);
        imported++;
      } catch (e) { console.error("import item fail", e); skipped++; }
    }
    toast(imported + " import hue, " + skipped + " skip hue", imported > 0 ? "success" : "error", 5000);
    renderIO(view);
  });
  impCard.append(impBtn, preview);
  panel.append(impCard);

  view.append(panel);
}

console.log("HISSA 3 loaded OK — app ready");
// ==== HISSA 3 END ====
</script>
