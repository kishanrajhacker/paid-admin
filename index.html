}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font-body); background: var(--bg); background-image: var(--grad-bg); background-attachment: fixed; color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; transition: background-color .6s ease, color .6s ease; }
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 700; letter-spacing: -.01em; margin: 0; }
a { color: var(--green); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--text-mute); }
.hidden { display: none !important; }

.topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg-elev) 92%, transparent); backdrop-filter: saturate(140%) blur(12px); -webkit-backdrop-filter: saturate(140%) blur(12px); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--grad-brand); display: grid; place-items: center; color: #fff; font-weight: 800; font-family: var(--font-head); box-shadow: var(--shadow); font-size: 18px; }
.brand-title { font-family: var(--font-head); font-weight: 800; font-size: 16px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: var(--text-mute); letter-spacing: .04em; text-transform: uppercase; }
.topbar-spacer { flex: 1; }
.user-chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: var(--bg-soft); border: 1px solid var(--line); min-height: 38px; }
.user-chip img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--line); }
.user-chip .uc-name { font-size: 13px; font-weight: 600; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { width: var(--tap); height: var(--tap); min-width: var(--tap); display: inline-grid; place-items: center; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; color: var(--text); transition: background .15s, border-color .15s, transform .15s; }
.icon-btn:hover { background: var(--green-soft); border-color: var(--green); transform: translateY(-1px); }
.theme-wrap { position: relative; }
.theme-menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--bg-elev); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; width: 220px; z-index: 100; display: grid; gap: 2px; max-height: 70vh; overflow-y: auto; }
.theme-menu button { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: transparent; border-radius: 9px; font-size: 13px; font-weight: 600; text-align: left; color: var(--text); transition: background .12s; }
.theme-menu button:hover { background: var(--bg-soft); }
.theme-menu button[aria-pressed="true"] { background: var(--green-soft); color: var(--green-strong); }
.theme-swatch { width: 18px; height: 18px; border-radius: 6px; flex: none; border: 1px solid rgba(0,0,0,.15); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 0 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 14px; background: var(--green); color: #fff; transition: filter .15s, transform .1s; white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; cursor: not-allowed; filter: none; transform: none; }
.btn-ghost { background: var(--bg-soft); color: var(--text); border-color: var(--line); }
.btn-ghost:hover { background: var(--green-soft); border-color: var(--green); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger-ghost { background: var(--red-soft); color: var(--red); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }
.btn-google { background: #fff; color: #1a1a1a; border: 1px solid #d0d0d0; }
.btn-google:hover { background: #f5f5f5; }
.btn-google svg { width: 18px; height: 18px; }

.tabs { position: sticky; top: 60px; z-index: 35; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.tabs-inner { max-width: var(--max); margin: 0 auto; padding: 0 8px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-inner::-webkit-scrollbar { display: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 14px; background: transparent; border: 0; color: var(--text-soft); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { color: var(--green); border-bottom-color: var(--green); }
.tab-badge { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; font-size: 11px; font-weight: 800; border-radius: 999px; background: var(--gold); color: #3a2a00; }

main { max-width: var(--max); margin: 0 auto; padding: 18px 16px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.page-head h1 { font-size: clamp(20px, 4.6vw, 26px); }
.page-head p { margin: 4px 0 0; color: var(--text-soft); font-size: 13.5px; }
.card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--bg-soft); color: var(--text-soft); border: 1px solid var(--line); }
.chip.green { background: var(--green-soft); color: var(--green-strong); border-color: color-mix(in srgb, var(--green) 30%, transparent); }
.chip.gold { background: var(--gold-soft); color: #7a5b00; border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.chip.red { background: var(--red-soft); color: var(--red); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
.price-badge { font-family: var(--font-head); font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; background: var(--gold-soft); color: #6b4f00; border: 1px solid color-mix(in srgb, var(--gold) 55%, transparent); }
.price-badge.free { background: var(--green-soft); color: var(--green-strong); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
.flag.warn { background: var(--red-soft); color: var(--red); }
.flag.ok { background: var(--green-soft); color: var(--green-strong); }
.flag.info { background: var(--gold-soft); color: #7a5b00; }

.filterbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.seg { display: inline-flex; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.seg button { min-height: 38px; padding: 0 14px; border: 0; background: transparent; color: var(--text-soft); font-weight: 600; font-size: 13.5px; border-radius: 9px; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--bg-elev); color: var(--green); box-shadow: var(--shadow); }
.seg .count { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: var(--bg-soft); }
.seg button[aria-pressed="true"] .count { background: var(--green-soft); color: var(--green-strong); }

.input, .select, .textarea { width: 100%; min-height: var(--tap); padding: 10px 12px; background: var(--bg-elev); border: 1px solid var(--line); border-radius: 11px; color: var(--text); font-size: 14.5px; transition: border-color .15s, box-shadow .15s; }
.input:hover, .select:hover, .textarea:hover { border-color: var(--line-strong); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
.textarea { min-height: 100px; resize: vertical; font-family: var(--font-body); }
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-wrap .input { padding-left: 38px; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-mute); pointer-events: none; }

.order-card { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 10px; transition: border-color .15s; }
.order-card:hover { border-color: var(--line-strong); }
.order-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.order-title { font-family: var(--font-head); font-weight: 700; font-size: 16px; margin: 0; }
.order-email { font-size: 13px; color: var(--text-soft); word-break: break-all; }
.order-amount { font-family: var(--font-head); font-weight: 800; font-size: 18px; color: var(--text); white-space: nowrap; }
.order-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.utr-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--bg-soft); border: 1px dashed var(--line-strong); padding: 8px 10px; border-radius: 10px; }
.utr-label { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.utr-val { font-family: var(--font-mono); font-weight: 600; font-size: 15px; letter-spacing: .02em; }
.order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.order-actions .btn { flex: 1; min-width: 110px; }
.order-note { font-size: 13px; color: var(--text-soft); font-style: italic; }
.helper-line { display: flex; gap: 8px; align-items: flex-start; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 40%, transparent); color: #6b4f00; padding: 10px 12px; border-radius: 11px; font-size: 13px; font-weight: 600; }

.app-row { background: var(--bg-elev); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; transition: border-color .15s; }
.app-row:hover { border-color: var(--line-strong); }
.app-avatar { width: 48px; height: 48px; border-radius: 12px; flex: none; display: grid; place-items: center; overflow: hidden; background: var(--grad-brand); color: #fff; font-family: var(--font-head); font-weight: 800; font-size: 20px; border: 1px solid var(--line); }
.app-avatar img { width: 100%; height: 100%; object-fit: cover; }
.app-main { min-width: 0; }
.app-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.app-pkg { font-family: var(--font-mono); font-size: 12px; color: var(--text-soft); word-break: break-all; }
.app-sub { font-size: 12px; color: var(--text-mute); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
.app-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.app-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.star-btn { background: transparent; border: 0; color: var(--text-mute); font-size: 18px; line-height: 1; padding: 6px; border-radius: 8px; }
.star-btn[aria-pressed="true"] { color: var(--gold); }

.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 36px; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track { width: 42px; height: 24px; border-radius: 999px; background: var(--line-strong); position: relative; transition: background .18s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .18s; }

  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", size); svg.setAttribute("height", size); svg.setAttribute("viewBox", "0 0 100 100");
  const cx = 50, cy = 50, r1 = 42, start = -90, end = 180;
  const largeArc = end - start > 180 ? 1 : 0;
  const rad = (d) => (d * Math.PI) / 180;
  const x1 = cx + r1 * Math.cos(rad(start)), y1 = cy + r1 * Math.sin(rad(start));
  const x2 = cx + r1 * Math.cos(rad(end)), y2 = cy + r1 * Math.sin(rad(end));
  const outer = document.createElementNS(ns, "path");
  outer.setAttribute("d", `M ${x1} ${y1} A ${r1} ${r1} 0 ${largeArc} 1 ${x2} ${y2}`);
  outer.setAttribute("fill", "none"); outer.setAttribute("stroke", "url(#loaderGrad)");

  outer.classList.add("spin-outer"); svg.appendChild(outer);

  inner.setAttribute("fill", "none"); inner.setAttribute("stroke", "currentColor");
  inner.setAttribute("stroke-width", "2.5"); inner.setAttribute("stroke-dasharray", "6 8"); inner.setAttribute("opacity", "0.55");
  inner.classList.add("spin-inner"); svg.appendChild(inner);
  for (let i = 0; i < 3; i++) {
    const angle = (i * 120 - 90) * (Math.PI / 180);
    const dx = cx + 36 * Math.cos(angle), dy = cy + 36 * Math.sin(angle);
    const dot = document.createElementNS(ns, "circle");
    dot.setAttribute("cx", dx); dot.setAttribute("cy", dy); dot.setAttribute("r", 3.4);
    dot.setAttribute("fill", "currentColor"); dot.classList.add("dot"); svg.appendChild(dot);
  }
  const arrow = document.createElementNS(ns, "g"); arrow.classList.add("arrow");
  const stem = document.createElementNS(ns, "rect");
  stem.setAttribute("x", "48"); stem.setAttribute("y", "40"); stem.setAttribute("width", "4"); stem.setAttribute("height", "13"); stem.setAttribute("rx", "2"); stem.setAttribute("fill", "currentColor");
  const head = document.createElementNS(ns, "path"); head.setAttribute("d", "M50 58 L43 50 L57 50 Z"); head.setAttribute("fill", "currentColor");
  arrow.appendChild(stem); arrow.appendChild(head); svg.appendChild(arrow);
  wrap.appendChild(svg); return wrap;
}

function startListeners() {
  if (!db) return;
  clearListeners();
  try {
    const unsub = onValue(ref(db, "orders"), (snap) => {
      const val = snap.val() || {};
      const prev = state.knownPendingIds; const next = new Set();
      for (const uid of Object.keys(val)) {
        const g = val[uid] || {};
        for (const oid of Object.keys(g)) {
          const o = g[oid] || {};
          if ((o.status || "").toLowerCase() === "pending") next.add(uid + "/" + oid);
        }
      }
      if (!state.firstOrdersLoad && state.ordersLoaded) {
        let hasNew = false; next.forEach((id) => { if (!prev.has(id)) hasNew = true; });
        if (hasNew) { toast("Naya order aaya"); beepNewOrder(); }
      }
      state.knownPendingIds = next; state.ordersRaw = val; state.ordersLoaded = true;
      updateOrdersBadge();
      if (["orders", "customers", "sales"].includes(state.route.name)) renderRoute();
      state.firstOrdersLoad = false;
    }, (err) => handleDbError(err, "orders"));
    state.listeners.push(unsub);
  } catch (e) { handleDbError(e, "orders"); }
  try {
    const unsub = onValue(ref(db, "paidApps"), (snap) => {
      state.paidApps = snap.val() || {}; state.appsLoaded = true;
      if (["apps", "new", "edit", "sales", "io"].includes(state.route.name)) renderRoute();
    }, (err) => handleDbError(err, "paidApps"));
    state.listeners.push(unsub);
  } catch (e) { handleDbError(e, "paidApps"); }
  try {
    const unsub = onValue(ref(db, "premiumLinks"), (snap) => {
      state.premiumLinks = snap.val() || {};
      if (state.route.name === "edit") renderRoute();
    }, (err) => console.warn("premiumLinks error", err));
    state.listeners.push(unsub);
  } catch (e) { console.warn("premiumLinks", e); }
  try {
    const unsub = onValue(ref(db, "purchases"), (snap) => {
      state.purchasesRaw = snap.val() || {}; state.purchasesLoaded = true;
      if (["customers", "sales"].includes(state.route.name)) renderRoute();
    }, (err) => handleDbError(err, "purchases"));
    state.listeners.push(unsub);
  } catch (e) { handleDbError(e, "purchases"); }
}
function updateOrdersBadge() {

function parseHash() {
  const h = (location.hash || "#/orders").replace(/^#\/?/, "");

  const [name, ...rest] = h.split("/");
  return { name, id: rest.join("/") || null };
}
function go(name, id) {
  const target = "#/" + name + (id ? "/" + id : "");
  if (location.hash !== target) location.hash = target; else handleRoute();
}

  go(btn.getAttribute("data-tab"));
});
function handleRoute() {
  if (!state.user) return;
  state.route = parseHash();
  $$("#tabs .tab").forEach((t) => {
    t.removeAttribute("aria-current");
    const n = t.getAttribute("data-tab");
    if (n === state.route.name || (n === "apps" && state.route.name === "edit")) t.setAttribute("aria-current", "page");
  });
  renderRoute();
}
function renderRoute() {
  const main = $("#main"); if (!main) return; main.innerHTML = "";
  switch (state.route.name) {
    case "orders": renderOrders(main); break;
    case "apps": renderApps(main); break;
    case "new": renderForm(main, null); break;
    case "edit": renderForm(main, state.route.id); break;
    case "customers": renderCustomers(main); break;
    case "sales": renderSales(main); break;
    case "io": renderIO(main); break;
    default: renderOrders(main);
  }
  updateOnlineUI();
}

function beepNewOrder() {

    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(880, ctx.currentTime); o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.12);
    g.gain.setValueAtTime(0.001, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);

  } catch {}

function collectOrders() {
  const list = [];
  try {
    for (const uid of Object.keys(state.ordersRaw)) {
      const g = state.ordersRaw[uid] || {};
      for (const oid of Object.keys(g)) {
        const o = g[oid] || {};
        list.push({ uid, orderId: oid, email: escapeText(o.email || ""), appId: escapeText(o.appId || ""), appName: escapeText(o.appName || ""), amount: asNumber(o.amount, 0), utr: escapeText(o.utr || ""), status: (escapeText(o.status || "pending")).toLowerCase(), createdAt: o.createdAt, note: escapeText(o.note || ""), approvedAt: o.approvedAt });
      }
    }
  } catch {}
  list.sort((a, b) => { const ta = typeof a.createdAt === "number" ? a.createdAt : 0; const tb = typeof b.createdAt === "number" ? b.createdAt : 0; return tb - ta; });

}
function utrDuplicateSet(orders) {
  const map = new Map(); for (const o of orders) { if (o.utr) map.set(o.utr, (map.get(o.utr) || 0) + 1); }
